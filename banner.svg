<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="PILUSATRIOx - Arsip Karya dan Eksperimen" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.23  0 0 0 0 0.16  0 0 0 0 0.12  0 0 0 0.09 0"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.2"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#e9d9b8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#b98f5a" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <!-- kertas -->
  <rect width="1200" height="360" fill="#f4e9d3"/>
  <rect width="1200" height="360" fill="url(#vignette)"/>
  <rect width="1200" height="360" filter="url(#grain)"/>

  <!-- bingkai ganda -->
  <rect x="20" y="20" width="1160" height="320" fill="none" stroke="#3b2a1e" stroke-width="3"/>
  <rect x="30" y="30" width="1140" height="300" fill="none" stroke="#3b2a1e" stroke-width="1"/>

  <!-- kepala surat -->
  <g font-family="'Courier New', Courier, monospace" font-size="15" fill="#6b4f3a" letter-spacing="3">
    <text x="60" y="68">ARSIP NO. 001</text>
    <text x="1140" y="68" text-anchor="end">EDISI GRESIK · TERBIT TERUS</text>
  </g>
  <line x1="60" y1="80" x2="1140" y2="80" stroke="#3b2a1e" stroke-width="1"/>

  <!-- judul -->
  <text x="600" y="190" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#3b2a1e" letter-spacing="8">PILUSATRIO<tspan fill="#b7410e" font-style="italic" font-weight="400">x</tspan></text>

  <!-- garis hias mustard -->
  <rect x="300" y="212" width="600" height="6" fill="#d9a441"/>
  <rect x="300" y="224" width="600" height="2" fill="#3b2a1e"/>

  <!-- subjudul -->
  <text x="600" y="268" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="#6b4f3a">Arsip Karya &amp; Eksperimen</text>
  <text x="600" y="304" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="17" fill="#3b2a1e" letter-spacing="2">“Kopi tumpah, ide nggak.”</text>

  <!-- stempel karat -->
  <g transform="translate(1030 215) rotate(-14)" filter="url(#rough)" opacity="0.88">
    <rect x="-80" y="-34" width="160" height="68" fill="none" stroke="#b7410e" stroke-width="4"/>
    <rect x="-73" y="-27" width="146" height="54" fill="none" stroke="#b7410e" stroke-width="1.5"/>
    <text x="0" y="-4" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="700" fill="#b7410e" letter-spacing="3">ASLI</text>
    <text x="0" y="18" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" fill="#b7410e" letter-spacing="2">BUKAN PASARAN</text>
  </g>

  <!-- lingkaran cap olive -->
  <g transform="translate(170 215)" filter="url(#rough)" opacity="0.8">
    <circle r="46" fill="none" stroke="#6b705c" stroke-width="3"/>
    <circle r="38" fill="none" stroke="#6b705c" stroke-width="1"/>
    <text y="-4" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#6b705c">P·Z</text>
    <text y="16" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6b705c" letter-spacing="2">EST. 2026</text>
  </g>

  <!-- kaki -->
  <line x1="60" y1="316" x2="1140" y2="316" stroke="#3b2a1e" stroke-width="1"/>
</svg>
